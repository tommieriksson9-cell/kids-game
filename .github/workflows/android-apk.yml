name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.3
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
          sudo mv godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Install matching Godot export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d templates
          cp -r templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BlockyQuest-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockyQuest-Android-APK
          path: build/BlockyQuest-debug.apk
          if-no-files-found: error
          retention-days: 14
