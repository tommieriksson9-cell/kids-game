name: Validate Godot project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"
          mv godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot-bin/godot

      - name: Validate project in headless editor
        run: godot --headless --path . --editor --quit
